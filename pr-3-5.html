<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        img{
            display: block;
            max-width: 100%;
        }
        section{
            position: relative;
            margin-bottom: 20%;
        }
        .container{
            display: grid;
            grid-template-columns: repeat(4,1fr);
        }
        .capa{
            width: 200px;height: 200px;
            position: absolute;
            top: 0;
            
        }
        section:nth-child(1) div{
            background-color: wheat;
            mix-blend-mode: color;
        }
        section:nth-child(2) div{
            background-color: red;
            mix-blend-mode: color-burn;
        }
        section:nth-child(3) div{
            background-color: blue;
            mix-blend-mode: exclusion;
        }
        section:nth-child(4) div{
            background-color: aqua;
            mix-blend-mode: darken;
        }
        section:nth-child(5) div{
            background-color: blueviolet;
            mix-blend-mode: multiply;
        }
        section:nth-child(6) div{
            background-color: rgba(216, 191, 216, 0.774);
            mix-blend-mode: luminosity;
        }
        section:nth-child(7) div{
            background-color: burlywood;
            mix-blend-mode: hard-light;
        }
        section:nth-child(8) div{
            background-color: chartreuse;
            mix-blend-mode: saturation;
        }
        section:nth-child(9) div{
            background-color: brown;
            mix-blend-mode: hue;
        }
        section:nth-child(10) div{
            background-color: darkblue;
            mix-blend-mode: lighten;
        }
        section:nth-child(11) div{
            background-color: bisque;
            mix-blend-mode: overlay;
        }
        section:nth-child(12) div{
            background-color: darkorange;
            mix-blend-mode: screen;
        }
        section:nth-child(13) div{
            background-color: rgba(240, 255, 255, 0.384);
            mix-blend-mode: color-dodge;
        }
        section:nth-child(14) div{
            background-color: crimson;
            mix-blend-mode: soft-light;
        }
        section:nth-child(15) div{
            background-color: burlywood;
            mix-blend-mode: saturation;
        }
        section:nth-child(16) div{
            background-color: aliceblue;
            mix-blend-mode: multiply;
        }
    </style>
</head>
<body>
    <div class="container">
        <section>
            <img src="http://picsum.photos/id/250/200/200" alt="">
            <div class="capa"></div>
        </section>
