<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            box-sizing: border-box;margin: 0;padding: 0;
        }
        .container{
            width: 95dvw;height: 95dvh;
            margin: 100px auto;
            background-color: #ddd;
            display: grid;
            place-items: center;
        }
        .cubo{
            width: 300px;height: 300px;
            background-color: gray;
            transform: perspective(600px) rotateX(-30deg) rotateY(-30deg);
            transform-style: preserve-3d;
            animation: girar3D 5s linear infinite;
        }
        .cara{
            position: absolute;
            width: 300px;height: 300px;
            
        }
        .izda{
            background-color: green;
            transform: rotateY(90deg) translateZ(-150px);
        }
        .drch{
            background-color: blue;
            transform: rotateY(90deg) translateZ(150px);
        }
        .fondo{
            background-color: purple;
            transform: translateZ(-150px);
        }
        .inf{
            background-color: pink;
            transform: rotateX(90deg) translateZ(-150px);
        }
        .sup{
            background-color: orange;
            transform: rotateX(90deg) translateZ(150px);
        }
        .frente{
            background-color: red;
            transform: translateZ(150px);
        }
        @keyframes girar3D {
            from{
                transform: rotateX(-180deg) rotateY(-360deg);
            }
            to{
                transform: rotateX(180deg) rotateY(360deg);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="cubo">
            <div class="cara izda"></div>
            <div class="cara drch"></div>
            <div class="cara sup"></div>
            <div class="cara inf"></div>
            <div class="cara frente"></div>
            <div class="cara fondo"></div>
        </div>
    </div>
</body>
</html>
