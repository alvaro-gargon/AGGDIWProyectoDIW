<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;padding: 0;
            box-sizing: border-box;
        }
        body{
            width: 90vw;height: 90vh;
            padding: 20px;
            margin: auto;
            background: radial-gradient(rgb(0,247,255)20%, yellow 80%);
            background-repeat: no-repeat;
            background-size: 100% 100%;
        }
        .wrapper{
            width: 90%;
            height: 90%;
            margin: auto;
            background-image: url(./images/barcos.png);
            background-repeat: no-repeat;
            background-size: contain;

            mask-image: url(./images/barcos.png);
            /* mask-image: linear-gradient(black 30%, transparent 60%); */
            mask-size: contain;
            mask-repeat: no-repeat;
        }
    </style>
</head>
<body>
    <div class="wrapper"></div>
</body>
</html>
