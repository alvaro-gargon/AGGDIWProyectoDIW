<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Práctica 4-3</title>
    <style>
        *{
            box-sizing: border-box;
            margin: 0;padding: 0;
            --color:red;
            --color2:yellow;
        }
        .container{
            width: 500px;height: 500px;
            background-color: #aaa;
            margin: 200px auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .helice{
            position: relative;
            width: 50px;height: 50px;
            border-radius: 10px;
            background-color: red;
            box-shadow: 0 80px var(--color2), 0 -80px var(--color2),
            80px 0 var(--color), -80px 0 var(--color);
            transition: all 1s ease;
            &:hover{
                /* transform-origin: center; */
                transform: rotate(90deg);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="helice">

        </div>
    </div>
</body>
</html>
