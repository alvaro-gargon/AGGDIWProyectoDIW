<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        :root{
            --colorCara:blue;
            --colorReves:red;
        }
        *{
            box-sizing: border-box;
            margin: 0;padding: 0;
            font-family: sans-serif;
        }
        .wrapper{
            width: 600px;height: 600px;
            background-color: #bbb;
            margin: 100px auto;
            display: grid;
            place-items: center;
            perspective: 350px;
        }
        .carta{
            position: relative;
            width: 250px;height: 350px;
            background-color: #ddd;
            transform-style: preserve-3d;
            transition: all 1s linear;
        }
        .cara, .reves{
            display: flex;top: 0;
            justify-content: center;
            align-items: center;
            position: absolute;
            width: 100%;height: 100%;
            font-size: 12rem;
            backface-visibility: hidden;
        }
        .cara{
            background-color: var(--colorCara);
            z-index: 1;
        }
        .reves{
            background-color: var(--colorReves);
            transform: rotateY(180deg);
        }
        .carta:hover{
            animation: girar 4s ease forwards; /* con forward, se queda en el final*/
        }
        @keyframes girar {
            to{
                transform: rotateY(180deg);
            }
        }
        
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="carta">
            <div class="cara">1</div>
            <div class="reves">2</div>
        </div>
    </div>
</body>
</html>
