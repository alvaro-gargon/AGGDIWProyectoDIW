<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practica 2-10-4</title>
    <style>
        *{box-sizing: border-box;}
        .flex, .grid{
            & div:nth-child(odd){
                background-color: #a5d2d2;
            }
            & div:nth-child(even){
                background-color: #96b98c;
            }
        }
        
        .flex{
            display: flex;
            flex-flow: column wrap;
            height: 300px;width: 400px;
            margin-bottom: 40px;
            & div{
                flex:0 0 60px;
                width: 100px;
            }
            & div:nth-child(n+11){
                width: 200px;
            }
        }
        .grid{
            height: 300px;width: 400px;
            display: grid;
            grid-template-columns: 100px 100px 200px;
            grid-template-rows: repeat(5, 60px);
            grid-auto-flow: column;
            & div{
                display: grid;
                place-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="flex">
            <div>1</div>
            <div>2</div>
            <div>3</div>
            <div>4</div>
            <div>5</div>
            <div>6</div>
            <div>7</div>
            <div>8</div>
            <div>9</div>
            <div>10</div>
            <div>11</div>
            <div>12</div>
        </div>
        <div class="grid">
            <div>1</div>
            <div>2</div>
            <div>3</div>
            <div>4</div>
            <div>5</div>
            <div>6</div>
            <div>7</div>
            <div>8</div>
            <div>9</div>
            <div>10</div>
            <div>11</div>
            <div>12</div>
        </div>
    </div>
</body>
</html>
