<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{box-sizing: border-box;margin: 0;padding: 0;font-family: sans-serif;}
        .container{
            width: 90vw;height: 90vh;
        }
        .box{
            position: relative;
            width: 400px;height: 300px;
            background: url(http://picsum.photos/id/250/400/300);
            border: 3px solid red;
            margin:50px auto;
            overflow: hidden;
            & *{transition: left 1s ease-in;}
            & h1,p{
                position: absolute;
                color: white;
                left: 120%;
            }
            & h1{
                top: 35%;
            }
            & p{
                top: 55%;width: 100%;
            }
        }
        .capa{
            position: absolute;top: 0;left: 100%;
            width: 392px;height: 292px;
            background-color: rgba(255, 0, 0, 0.308);
        }
        .box:hover .capa{left: 0;}
        .box:hover h1{left: 40%; transition-delay: 1s;}
        .box:hover p{left: 30%;transition-delay: 2s;}
    </style>
</head>
<body>
    <div class="container">
        <div class="box">
            <div class="capa"></div>
            <h1>Titulo</h1>
            <p>Esto es una prueba</p>
        </div>
    </div>
</body>
</html>
